<h2>{{ workbook().name }}</h2>
<editor-top-bar></editor-top-bar>
<div class="wrapper">
  <div class="row" *ngFor="let row of rows">
    <editor-cell
      *ngFor="let col of cols"
      [cell]="getCell(col + row)"
      [cellId]="col + row"
      [isActive]="isCellActive(col + row)"
      (update)="updateCell(col + row, $event)"
      (select)="selectCell($event)"
    ></editor-cell>
  </div>

</div>
