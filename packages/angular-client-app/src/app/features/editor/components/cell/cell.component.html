<div class="content" [class.active]="isActive" [ngStyle]="cellStyles()" (click)="onCellClick($event)" (dblclick)="enableEdit()">{{cell?.value}}</div>
<div class="edit" *ngIf="edit()">
  <input
    type="text"
    [value]="editValue()"
    [ngStyle]="cellStyles()"
    (input)="onInputChange($event)"
    #editInput
    autofocus />
</div>
